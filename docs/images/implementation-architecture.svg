<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the visual quantum implementation</title>
  <desc id="desc">The Logic Apps designer creates workflow JSON. In the Logic Apps Standard host, the circuit builder, local Q# simulator provider, and Azure Quantum provider run in process. The Azure Quantum provider uses the Logic App managed identity to submit native programs directly to the workspace. Storage and monitoring support the host; Bicep and deployment scripts provision and publish it.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61d9d0"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef4ff}.title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:16px;fill:#aebbd7}.small{font-size:13px;fill:#aebbd7}</style>
  <rect width="1200" height="690" rx="24" fill="#0e172c"/>
  <text x="42" y="55" class="title">Visual workflows, in-host providers, two quantum targets</text>
  <text x="42" y="87" class="body">Logic Apps orchestrates; each simulator or workspace job owns quantum state.</text>
  <rect x="40" y="124" width="220" height="292" rx="15" fill="#16253f" stroke="#304161"/>
  <text x="60" y="162" class="label">Authoring</text>
  <rect x="60" y="183" width="180" height="81" rx="10" fill="#19383e" stroke="#61d9d0"/><text x="76" y="216" class="body">Logic Apps designer</text><text x="76" y="244" class="small">Visual gate actions</text>
  <path d="M150 266V291" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="299" width="180" height="82" rx="10" fill="#1b2b48" stroke="#4b638a"/><text x="76" y="334" class="body">workflow.json</text><text x="76" y="362" class="small">Connections + expressions</text>
  <path d="M261 341H289" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="299" y="124" width="530" height="292" rx="15" fill="#16253f" stroke="#61d9d0"/>
  <text x="320" y="162" class="label">Logic Apps Standard host</text><text x="320" y="186" class="small">NuGet-based project | .NET 8 | Windows x64</text>
  <rect x="320" y="208" width="238" height="53" rx="8" fill="#19383e"/><text x="337" y="241" class="body">Circuit Builder provider</text>
  <rect x="320" y="272" width="238" height="53" rx="8" fill="#342c58"/><text x="337" y="304" class="body">Local Q# Circuit provider</text>
  <rect x="320" y="336" width="238" height="53" rx="8" fill="#19383e"/><text x="337" y="368" class="body">Azure Quantum provider</text>
  <rect x="589" y="247" width="215" height="113" rx="10" fill="#342c58" stroke="#b39aff"/><text x="608" y="281" class="label">Circuit executor</text><text x="608" y="309" class="body">Validate + compile inputs</text><text x="608" y="336" class="small">RunCircuit.Run(...)</text>
  <path d="M559 298H575V304H587" fill="none" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M804 280H846V250H860" fill="none" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M804 331H846V346H860" fill="none" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M559 362H846V346H860" fill="none" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="870" y="124" width="290" height="292" rx="15" fill="#211d38" stroke="#b39aff"/>
  <text x="891" y="162" class="label">Quantum execution</text>
  <rect x="891" y="184" width="246" height="91" rx="10" fill="#342c58"/><text x="909" y="213" class="body">Compiled Q# simulator</text><text x="909" y="239" class="small">FullState; fresh shot execution</text><text x="909" y="261" class="small">Local, in-process runtime</text>
  <rect x="891" y="294" width="246" height="99" rx="10" fill="#19383e" stroke="#61d9d0"/><text x="909" y="322" class="body">Azure Quantum workspace</text><text x="909" y="348" class="small">Managed identity; native provider jobs</text><text x="909" y="373" class="small">Rigetti | IonQ | Quantinuum</text>
  <path d="M1014 417V455H690V419" fill="none" stroke="#b39aff" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="841" y="447" class="small">Results + empirical probabilities</text>
  <rect x="40" y="489" width="1120" height="151" rx="15" fill="#16253f" stroke="#304161"/>
  <text x="62" y="526" class="label">Provisioning, deployment and operations</text>
  <rect x="62" y="545" width="327" height="67" rx="9" fill="#1b2b48"/><text x="80" y="572" class="body">Bicep + deploy.ps1</text><text x="80" y="596" class="small">Build, zip deploy, smoke tests, identity setup</text>
  <rect x="415" y="545" width="327" height="67" rx="9" fill="#1b2b48"/><text x="433" y="572" class="body">Storage account + file share</text><text x="433" y="596" class="small">Workflow state and application content</text>
  <rect x="768" y="545" width="368" height="67" rx="9" fill="#1b2b48"/><text x="786" y="572" class="body">Application Insights + Log Analytics</text><text x="786" y="596" class="small">Telemetry, action failures, operational visibility</text>
  <text x="42" y="670" class="small">Conceptual architecture. The Azure Quantum execution path has no separate Function App hop.</text>
</svg>
