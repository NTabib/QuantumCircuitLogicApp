<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Immutable circuit descriptors evolve across visual gate actions</title>
  <desc id="desc">Create circuit returns an empty instruction list. Hadamard returns a new list with H on qubit zero. CNOT returns another list with H and CNOT. The final executor prepares the register, executes both gates without intermediate measurement and then returns classical counts.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#61d9d0"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#eef4ff}.title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:600}.body{font-size:17px;fill:#aebbd7}.mono{font-family:Consolas,monospace;font-size:17px}.small{font-size:14px;fill:#aebbd7}</style>
  <rect width="1200" height="620" rx="24" fill="#0e172c"/>
  <text x="42" y="56" class="title">Pass a circuit plan, not a live qubit</text>
  <text x="42" y="88" class="body">Each visual gate action creates a new JSON descriptor. Earlier outputs stay unchanged.</text>
  <rect x="42" y="126" width="318" height="277" rx="15" fill="#19383e" stroke="#61d9d0"/>
  <text x="63" y="164" class="label">1. Create circuit</text><text x="63" y="197" class="small">Classical workflow data</text>
  <text x="63" y="243" class="mono">initialState: "00"</text><text x="63" y="280" class="mono">gates: []</text>
  <text x="63" y="361" class="small">No simulator allocation.</text>
  <path d="M364 264H405" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="421" y="126" width="318" height="277" rx="15" fill="#19383e" stroke="#61d9d0"/>
  <text x="442" y="164" class="label">2. Add Hadamard</text><text x="442" y="197" class="small">Append H(target=0)</text>
  <text x="442" y="243" class="mono">initialState: "00"</text><text x="442" y="280" class="mono">gates: [</text><text x="460" y="312" class="mono">{ gate: "H", target: 0 }</text><text x="442" y="342" class="mono">]</text>
  <text x="442" y="378" class="small">No quantum gate has run yet.</text>
  <path d="M743 264H784" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="126" width="358" height="277" rx="15" fill="#19383e" stroke="#61d9d0"/>
  <text x="821" y="164" class="label">3. Add CNOT</text><text x="821" y="197" class="small">Append control=0, target=1</text>
  <text x="821" y="243" class="mono">initialState: "00"</text><text x="821" y="280" class="mono">gates: [</text><text x="839" y="309" class="mono">{ gate: "H", target: 0 },</text><text x="839" y="338" class="mono">{ gate: "CNOT",</text><text x="850" y="365" class="mono">control: 0, target: 1 }</text><text x="821" y="389" class="mono">]</text>
  <path d="M979 404V440" stroke="#61d9d0" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="42" y="456" width="1116" height="119" rx="15" fill="#342c58" stroke="#b39aff"/>
  <text x="65" y="492" class="label">4. Execute complete circuit: the quantum boundary</text>
  <text x="65" y="525" class="mono">Prepare |00&gt; -&gt; H(0) -&gt; CNOT(0,1) -&gt; measure all qubits -&gt; return counts</text>
  <text x="65" y="553" class="small">One Q# invocation per shot. No measurements between gates. Execution retries can produce different samples.</text>
  <text x="42" y="605" class="small">Descriptor examples use abbreviated formatting; the actual connector inputs and outputs are JSON objects.</text>
</svg>
